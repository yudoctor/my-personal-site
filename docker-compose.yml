# 本地或单机部署用
# 生产环境（多机器 / 多实例）改用 Kubernetes 或 Swarm

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-personal-site:latest
    container_name: my-personal-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 数据库 / 上传目录：容器内路径
      - DATABASE_PATH=/app/data/site.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=524288000
      - NODE_ENV=production
      # 如已切到腾讯云 COS，在这里填（保持空就走本地）
      # - STORAGE_DRIVER=cos
      # - COS_SECRET_ID=
      # - COS_SECRET_KEY=
      # - COS_REGION=ap-guangzhou
      # - COS_BUCKET=
    volumes:
      # SQLite 文件 + WAL 模式需要持久化
      - ./data:/app/data
      # 上传文件
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/family/stats',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制（按需调整；8GB 主机建议 1-2GB）
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

# 如果以后接 COS，可以把 volumes 那两行注释掉
# 如果以后接 MySQL/PostgreSQL，加一个 db 服务，把 DATABASE_PATH 改成对应连接串